name: Android Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 允许在 tag 推送时创建 GitHub Release 并上传产物
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 签名密钥为可选项：未配置时使用 debug 签名兜底，保证仍能产出可安装包。
    # 若要正式上架，请在仓库 Settings → Secrets and variables → Actions 中配置：
    #   KEYSTORE_BASE64  (jks 文件的 base64 文本)
    #   KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Flutter pub get
        run: flutter pub get

      # 质量检查为非阻断：项目首次在 CI 构建时若有告警，仍继续出包，日志中可查看细节。
      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Test (non-blocking)
        continue-on-error: true
        run: flutter test

      - name: Setup release signing (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          EOF

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/
          cp build/app/outputs/bundle/release/app-release.aab artifacts/
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-ledger-release
          path: artifacts/*
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/*.aab
          generate_release_notes: true
