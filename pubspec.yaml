name: paper_ledger
description: "纸间账 · 纯本地手账记账 App（一期 Android only）"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- 本地数据库 ORM + SQLCipher 加密（PKG-02） ---
  # 注意：不引入 drift_flutter —— 它传递依赖 sqlite3_flutter_libs，
  # 与 sqlcipher_flutter_libs 打包同名 BuildConfig 导致 dex 合并冲突。
  # 本项目直接用 drift/native.dart + sqlcipher_flutter_libs 打开加密库。
  drift: ^2.22.0
  sqlcipher_flutter_libs: ^0.6.8
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- 密钥存储 / 锁屏（PKG-02 / PKG-07） ---
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # --- 状态管理 / 路由（PKG-01 锁定） ---
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # --- 工具 ---
  uuid: ^4.5.1
  intl: ^0.19.0
  csv: ^6.0.0
  crypto: ^3.0.6
  shared_preferences: ^2.3.3
  workmanager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/stickers/
    - assets/stickers/manifest.json
    - assets/fonts/OFL.txt
    - lib/data/local/assets/keywords.json
  # 视觉专项 VPKG-01：可商用中文手写字体（霞鹜文楷，SIL OFL 1.1）。
  # 体积约束已解除，完整字库直接打包，不做子集化。授权凭证见 assets/fonts/OFL.txt
  # 与 docs/visual_asset_licenses.md。字体族名与 AppTypography 保持一致。
  fonts:
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
          weight: 400
        - asset: assets/fonts/LXGWWenKai-Medium.ttf
          weight: 500
