name: paper_ledger
description: "纸间账 · 纯本地手账记账 App（一期 Android only）"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- 本地数据库 ORM + SQLCipher 加密（PKG-02） ---
  drift: ^2.22.0
  drift_flutter: ^0.2.1
  sqlcipher_flutter_libs: ^0.6.8
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- 密钥存储 / 锁屏（PKG-02 / PKG-07） ---
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # --- 状态管理 / 路由（PKG-01 锁定） ---
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # --- 工具 ---
  uuid: ^4.5.1
  intl: ^0.19.0
  csv: ^6.0.0
  crypto: ^3.0.6
  shared_preferences: ^2.3.3
  workmanager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/stickers/
    - lib/data/local/assets/keywords.json
